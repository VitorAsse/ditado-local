name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Compile Python modules
        run: python -m py_compile ditado_ai.py ditado_harness.py ditado_audio.py ditado_chat.py ditado_cloud.py ditado_desktop.py ditado_hotkey.py ditado_notification.py ditado_quick_correction.py ditado_local.pyw ditado_ollama.py ditado_storage.py ditado_skill_catalog.py ditado_theme.py

      - name: Run tests
        run: python -m unittest discover -v
